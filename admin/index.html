<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login | Rothschild Illuminati Organization</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="../assets/images/01_logo_emblem_transparent.png" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../css/variables.css" />
<link rel="stylesheet" href="../css/global.css" />
<link rel="stylesheet" href="../css/admin.css" />
<link rel="stylesheet" href="../css/responsive.css" />
</head>
<body class="admin-body">

<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand">
      <img src="../assets/images/01_logo_emblem_transparent.png" alt="Rothschild Emblem" class="monogram" />
      <h1>Administrator Sign In</h1>
      <p>Rothschild Illuminati Organization</p>
    </div>

    <form class="auth-form" id="loginForm" novalidate>
      <div class="form-field">
        <label for="emailInput">Email</label>
        <input type="email" id="emailInput" name="email" required autocomplete="username" />
      </div>
      <div class="form-field">
        <label for="passwordInput">Password</label>
        <input type="password" id="passwordInput" name="password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-gold auth-submit" id="loginSubmit">Sign In</button>
      <p class="auth-status" id="authStatus"></p>
    </form>

    <a href="../index.html" class="auth-back-link">&larr; Return to the public site</a>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/supabase-client.js" type="module"></script>
<script src="../js/admin/auth.js" type="module"></script>
</body>
</html>
