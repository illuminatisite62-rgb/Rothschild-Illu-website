<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Timeline | Admin | Rothschild Illuminati Organization</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="../assets/images/01_logo_emblem_transparent.png" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../css/variables.css" />
<link rel="stylesheet" href="../css/global.css" />
<link rel="stylesheet" href="../css/admin.css" />
<link rel="stylesheet" href="../css/responsive.css" />
</head>
<body class="admin-body" hidden>

<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="admin-sidebar-brand">
      <img src="../assets/images/01_logo_emblem_transparent.png" alt="Rothschild Emblem" class="monogram" />
      <span class="admin-sidebar-brand-text">
        <span class="name">ROTHSCHILD</span><br />
        <span class="tag">Admin</span>
      </span>
    </div>
    <nav class="admin-nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="profiles.html">Family Profiles</a>
      <a href="profile-editor.html">Add Profile</a>
      <a href="media.html">Media Library</a>
      <a href="timeline.html" class="active">Timeline</a>
      <a href="homepage.html">Homepage</a>
      <a href="settings.html">Site Settings</a>
    </nav>
    <div class="admin-sidebar-foot">
      <p class="admin-user-email" id="adminUserEmail"></p>
      <button class="admin-logout-btn" id="adminLogoutBtn">Logout</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div>
        <h1 class="admin-page-title">Timeline</h1>
        <p class="admin-page-desc">Manage the historical events shown on the History page.</p>
      </div>
    </div>

    <div class="admin-panel">
      <div class="admin-panel-heading">
        <h2 id="timelineFormTitle">Add Event</h2>
        <button type="button" id="cancelTimelineEditBtn" hidden style="border:1px solid var(--color-parchment-dark); border-radius:4px; padding:6px 12px; background:transparent;">Cancel Edit</button>
      </div>
      <form id="timelineForm">
        <input type="hidden" id="eventId" />
        <div class="admin-form-row admin-form-row--3">
          <div class="admin-form-field">
            <label for="eventYear">Year Label *</label>
            <input type="text" id="eventYear" required placeholder="e.g. 1815" />
          </div>
          <div class="admin-form-field">
            <label for="eventDate">Exact Date</label>
            <input type="date" id="eventDate" />
          </div>
          <div class="admin-form-field">
            <label for="eventCategory">Category</label>
            <input type="text" id="eventCategory" placeholder="e.g. Finance" />
          </div>
        </div>
        <div class="admin-form-field">
          <label for="eventTitle">Title *</label>
          <input type="text" id="eventTitle" required />
        </div>
        <div class="admin-form-field">
          <label for="eventDescription">Description</label>
          <textarea id="eventDescription" rows="3"></textarea>
        </div>
        <div class="admin-form-row">
          <div class="admin-form-field">
            <label for="eventImageUrl">Image URL</label>
            <input type="text" id="eventImageUrl" />
          </div>
          <div class="admin-form-field">
            <label for="eventDisplayOrder">Display Order</label>
            <input type="number" id="eventDisplayOrder" value="0" />
          </div>
        </div>
        <div class="admin-form-field">
          <label><input type="checkbox" id="eventPublished" style="width:auto; margin-right:8px;" /> Published</label>
        </div>
        <button type="submit" class="btn btn-gold" id="timelineSubmitBtn">Add Event</button>
      </form>
    </div>

    <div class="admin-panel">
      <div class="admin-panel-heading"><h2>All Events</h2></div>
      <div class="admin-table-wrap">
        <table class="admin-table" id="timelineTable">
          <thead>
            <tr><th>Order</th><th>Year</th><th>Title</th><th>Category</th><th>Status</th><th>Actions</th></tr>
          </thead>
          <tbody>
            <tr><td colspan="6" class="admin-empty">Loading&hellip;</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<div class="admin-toast" id="adminToast"></div>

<script src="../js/config.js"></script>
<script src="../js/supabase-client.js" type="module"></script>
<script src="../js/admin/timeline.js" type="module"></script>
</body>
</html>
