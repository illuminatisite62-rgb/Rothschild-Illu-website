<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Family Profiles | Admin | Rothschild Illuminati Organization</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="../assets/images/01_logo_emblem_transparent.png" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../css/variables.css" />
<link rel="stylesheet" href="../css/global.css" />
<link rel="stylesheet" href="../css/admin.css" />
<link rel="stylesheet" href="../css/responsive.css" />
</head>
<body class="admin-body" hidden>

<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="admin-sidebar-brand">
      <img src="../assets/images/01_logo_emblem_transparent.png" alt="Rothschild Emblem" class="monogram" />
      <span class="admin-sidebar-brand-text">
        <span class="name">ROTHSCHILD</span><br />
        <span class="tag">Admin</span>
      </span>
    </div>
    <nav class="admin-nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="profiles.html" class="active">Family Profiles</a>
      <a href="profile-editor.html">Add Profile</a>
      <a href="media.html">Media Library</a>
      <a href="archive-admin.html">Archive Manager</a>
      <a href="timeline.html">Timeline</a>
      <a href="membership.html">Membership</a>
      <a href="homepage.html">Homepage</a>
      <a href="settings.html">Site Settings</a>
    </nav>
    <div class="admin-sidebar-foot">
      <p class="admin-user-email" id="adminUserEmail"></p>
      <button class="admin-logout-btn" id="adminLogoutBtn">Logout</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div>
        <h1 class="admin-page-title">Family Profiles</h1>
        <p class="admin-page-desc">Create, edit, publish and manage biography profiles.</p>
      </div>
      <a href="profile-editor.html" class="btn btn-gold">+ Add Profile</a>
    </div>

    <div class="admin-panel">
      <div class="admin-panel-heading">
        <input type="search" id="profileSearch" placeholder="Search by name…" style="font-family: var(--font-serif); font-size: 14px; padding: 10px 14px; border: 1px solid var(--color-parchment-dark); border-radius: var(--radius-sm); background: var(--color-parchment); min-width: 240px;" />
        <select id="statusFilter" style="font-family: var(--font-serif); font-size: 13px; padding: 10px 14px; border: 1px solid var(--color-parchment-dark); border-radius: var(--radius-sm); background: var(--color-parchment);">
          <option value="">All statuses</option>
          <option value="published">Published</option>
          <option value="draft">Draft</option>
        </select>
      </div>
      <div class="admin-table-wrap">
        <table class="admin-table" id="profilesTable">
          <thead>
            <tr>
              <th>Name</th>
              <th>Branch</th>
              <th>Status</th>
              <th>Featured</th>
              <th>Updated</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr><td colspan="6" class="admin-empty">Loading&hellip;</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<div class="admin-toast" id="adminToast"></div>

<script src="../js/config.js"></script>
<script src="../js/supabase-client.js" type="module"></script>
<script src="../js/admin/profiles.js" type="module"></script>
</body>
</html>
